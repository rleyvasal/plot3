[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plot3"
version = "0.4.0"
description = "ggplot2 grammar of graphics for Python: interactive WebGL figures and journal-ready PNG, SVG, and PDF"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rleyvasal" }]
keywords = ["ggplot", "ggplot2", "grammar of graphics", "visualization", "plotting", "three.js", "dataframe"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Jupyter",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
fast = ["contourpy>=1.0"]
dev = ["pytest>=7.0", "polars>=1.0", "contourpy>=1.0"]
jupyter = ["ipython>=8.0"]
polars = ["polars>=1.0"]
export = ["cairosvg>=2.7"]

[project.urls]
Homepage = "https://github.com/rleyvasal/plot3"
Changelog = "https://github.com/rleyvasal/plot3/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["plot3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]

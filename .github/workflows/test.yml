name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contourpy: [with, without]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Uninstall contourpy
        if: matrix.contourpy == 'without'
        run: python -m pip uninstall -y contourpy
      - name: Test
        run: python -m pytest
